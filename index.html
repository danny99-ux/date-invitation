<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
overflow:hidden;
}

/* CARD */

.card{
background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
width:350px;
position:relative;
}

/* TEXT */

h1{ color:#d6336c; }
p{ font-size:18px; }

/* TYPING EFFECT */

#typingText{
font-size:20px;
min-height:40px;
}

/* NAME ANIMATION */

.name{
font-size:28px;
font-weight:bold;
color:#ff4d6d;
animation: glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 5px #ff4d6d; }
to{ text-shadow:0 0 20px #ff4d6d; }
}

/* BUTTONS */

.buttons{ margin-top:20px; }

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:8px;
margin:10px;
cursor:pointer;
transition:0.3s;
}

#yesBtn{
background:#ff4d6d;
color:white;
}

#yesBtn:hover{ transform:scale(1.1); }

.noBtn{
background:#444;
color:white;
position:absolute;
}

/* IMAGE */

img{
width:100%;
border-radius:15px;
margin-top:20px;
}

/* HIDDEN */

.hidden{
display:none;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

/* HEARTS */

.heart{
position:fixed;
bottom:-10px;
font-size:20px;
animation:float 5s linear infinite;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-100vh);}
}

</style>
</head>

<body>

<audio id="music">
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">

<!-- START SCREEN -->
<div id="startScreen">
<h1>Hey ❤️</h1>
<p id="typingText"></p>

<button id="startBtn" style="display:none;" onclick="startExperience()">
Start ❤️
</button>
</div>

<!-- STEP 1 -->
<div id="step1" class="hidden">
<h1>Hey <span class="name">[HER NAME]</span> ❤️</h1>
<p>Will you go on a date with me?</p>

<div class="buttons">
<button id="yesBtn" onclick="showDress()">YES ❤️</button>
<button class="noBtn" onmouseover="move(this)">NO 😜</button>
</div>
</div>

<!-- STEP 2 -->
<div id="step2" class="hidden">
<h1>This is for you 👗</h1>
<img src="dress.jpg">

<div class="buttons">
<button onclick="showMessage()">I’m ready 😍</button>
<button class="noBtn" onmouseover="move(this)">NO 😜</button>
</div>
</div>

<!-- STEP 3 -->
<div id="step3" class="hidden">
<h1>Wait… ❤️</h1>
<p><b>Hang tight, babe… tonight’s about to be special 😏</b></p>

<div class="buttons">
<button onclick="showLocation()">Okayyy 😍</button>
</div>
</div>

<!-- STEP 4 -->
<div id="step4" class="hidden">
<h1>Our Date ❤️</h1>
<p>📍 Your Special Place – 7PM</p>
<p>Can’t wait to see you in that dress 😍</p>
</div>

</div>

<script>

/* ✨ TYPING EFFECT */

var text = "Hey… I have something to ask you ❤️";
var index = 0;

function typeEffect(){
if(index < text.length){
document.getElementById("typingText").innerHTML += text.charAt(index);
index++;
setTimeout(typeEffect, 60);
}else{
document.getElementById("startBtn").style.display = "inline-block";
}
}

typeEffect();

/* START */

function startExperience(){
document.getElementById("startScreen").style.display="none";
document.getElementById("step1").classList.remove("hidden");

document.getElementById("music").play();
}

/* MOVE NO BUTTON */

function move(btn){
var x = Math.random() * (window.innerWidth - 100);
var y = Math.random() * (window.innerHeight - 50);

btn.style.position="fixed";
btn.style.left = x + "px";
btn.style.top = y + "px";
}

/* HEARTS */

function createHeart(){
var heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(Math.random()*20+10)+"px";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),5000);
}

/* CONFETTI */

function confetti(){
for(let i=0;i<100;i++){
let c=document.createElement("div");

c.style.position="fixed";
c.style.width="8px";
c.style.height="8px";
c.style.background="red";
c.style.left=Math.random()*100+"vw";
c.style.top="-10px";

document.body.appendChild(c);

setTimeout(()=>c.remove(),3000);
}
}

/* FLOW */

function showDress(){
document.getElementById("step1").style.display="none";
document.getElementById("step2").classList.remove("hidden");

confetti();
setInterval(createHeart,300);
}

function showMessage(){
document.getElementById("step2").style.display="none";
document.getElementById("step3").classList.remove("hidden");
}

function showLocation(){
document.getElementById("step3").style.display="none";
document.getElementById("step4").classList.remove("hidden");
}

</script>

</body>
</html>
